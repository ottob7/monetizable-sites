name: Update RAM price snapshot

on:
  schedule:
    # Daily at 10:17 UTC. Visitors read the committed JSON snapshot; they never call SerpApi.
    - cron: '17 10 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-ram-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate RAM price snapshot
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: npm run update:ram-prices

      - name: Commit updated snapshot
        run: |
          if git diff --quiet -- sites/ram-price-checker/data/ram-prices.json; then
            echo "No RAM price snapshot changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sites/ram-price-checker/data/ram-prices.json
          git commit -m "Update RAM price snapshot"
          git push
